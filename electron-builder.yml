appId: com.northshell.app
productName: Northshell
copyright: Copyright © 2026 Nikita Burakov
directories:
  buildResources: build
  output: dist
files:
  - out/**
  - package.json
  - "!**/*.map"
asarUnpack:
  - node_modules/node-pty/**
electronLanguages:
  - en
  - ru
mac:
  category: public.app-category.developer-tools
  icon: build/icon.png
  identity: "-"
  hardenedRuntime: false
  target:
    - target: dmg
      arch: [arm64]
  extendInfo:
    NSHumanReadableCopyright: Copyright © 2026 Nikita Burakov
dmg:
  title: "${productName} ${version}"
  artifactName: "${productName}-${version}-arm64.${ext}"
  format: ULFO
  background: build/background.png
  iconSize: 112
  window:
    width: 540
    height: 380
  contents:
    - x: 140
      y: 190
    - x: 400
      y: 190
      type: link
      path: /Applications
